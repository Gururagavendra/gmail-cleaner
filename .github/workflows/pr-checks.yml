name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request number
        type: string
        required: true
      head_sha:
        description: Expected immutable PR head commit (40 lowercase hex characters)
        type: string
        required: true

permissions:
  pull-requests: write
  contents: read

jobs:
  require-labels:
    if: github.repository_owner_id == '45983094' && github.actor_id == '45983094' && github.triggering_actor == 'daddyparodz' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.number == github.event.pull_request.number && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.id == github.event.repository.id && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64]
    container: node:24-bookworm-slim
    steps:
      - name: Check for labels
        id: check-labels
        uses: actions/github-script@v7
        with:
          script: |
            // Owner PR events or supplemental trusted dispatch; never check out PR code.
            const isPR = context.eventName === 'pull_request';
            const eventPR = context.payload.pull_request;
            if ((!isPR && context.eventName !== 'workflow_dispatch') ||
                process.env.GITHUB_ACTOR_ID !== '45983094' ||
                process.env.GITHUB_TRIGGERING_ACTOR !== 'daddyparodz' ||
                context.actor !== 'daddyparodz' ||
                context.repo.owner !== 'daddyparodz' || context.repo.repo !== 'gmail-cleaner' ||
                context.payload.repository.full_name !== 'daddyparodz/gmail-cleaner' ||
                context.payload.repository.owner.id !== 45983094 || (!isPR && context.ref !== 'refs/heads/main')) {
              throw new Error('Untrusted metadata dispatch');
            }
            const repo = context.payload.repository;
            if (isPR && (!['opened', 'labeled', 'unlabeled'].includes(context.payload.action) ||
                !Number.isSafeInteger(context.payload.number) || context.payload.number <= 0 ||
                eventPR?.number !== context.payload.number || eventPR.state !== 'open' ||
                eventPR.base?.repo?.id !== repo.id || eventPR.head?.repo?.id !== repo.id ||
                eventPR.base.repo.full_name !== repo.full_name || eventPR.head.repo.full_name !== repo.full_name ||
                eventPR.base.ref !== 'main' || !/^[0-9a-f]{40}$/.test(eventPR.base.sha || ''))) {
              throw new Error('Untrusted PR event provenance');
            }
            const inputs = isPR ? {pr_number: String(context.payload.number), head_sha: eventPR.head.sha} : context.payload.inputs || {};
            if (!/^[1-9][0-9]*$/.test(inputs.pr_number || '') ||
                !/^[0-9a-f]{40}$/.test(inputs.head_sha || '')) {
              throw new Error('Explicit PR number and immutable head SHA required');
            }
            const number = Number(inputs.pr_number);
            if (!Number.isSafeInteger(number)) throw new Error('Invalid PR number');
            async function resolve() {
              const {data: candidate} = await github.rest.pulls.get({...context.repo, pull_number: number});
              const repo = context.payload.repository;
              if (candidate.number !== number || candidate.state !== 'open' ||
                  candidate.base?.repo?.id !== repo.id || candidate.head?.repo?.id !== repo.id ||
                  candidate.base.repo.full_name !== repo.full_name || candidate.head.repo.full_name !== repo.full_name ||
                  candidate.base.ref !== 'main' || candidate.base.sha !== (isPR ? eventPR.base.sha : context.sha) ||
                  candidate.head.sha !== inputs.head_sha) {
                throw new Error('PR provenance changed or is not same-repository exact-head');
              }
              return candidate;
            }
            await resolve();
            const pr = await resolve();
            const labels = pr.labels || [];

            if (labels.length === 0) {
              core.setFailed('❌ This PR must have at least one label before it can be merged.');
              core.summary
                .addHeading('Label Required')
                .addRaw('This pull request requires at least one label to be merged.')
                .addRaw('Please add a label to your PR.')
                .write();
            } else {
              console.log(`✅ PR has ${labels.length} label(s): ${labels.map(l => l.name).join(', ')}`);
              core.summary
                .addHeading('Labels Check')
                .addRaw(`✅ PR has ${labels.length} label(s): ${labels.map(l => l.name).join(', ')}`)
                .write();
            }

  auto-assign:
    if: github.repository_owner_id == '45983094' && github.actor_id == '45983094' && github.triggering_actor == 'daddyparodz' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.number == github.event.pull_request.number && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.id == github.event.repository.id && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64]
    container: node:24-bookworm-slim
    steps:
      - name: Auto-assign PR creator
        uses: actions/github-script@v7
        with:
          script: |
            // Owner PR events or supplemental trusted dispatch; never check out PR code.
            const isPR = context.eventName === 'pull_request';
            const eventPR = context.payload.pull_request;
            if ((!isPR && context.eventName !== 'workflow_dispatch') ||
                process.env.GITHUB_ACTOR_ID !== '45983094' ||
                process.env.GITHUB_TRIGGERING_ACTOR !== 'daddyparodz' ||
                context.actor !== 'daddyparodz' ||
                context.repo.owner !== 'daddyparodz' || context.repo.repo !== 'gmail-cleaner' ||
                context.payload.repository.full_name !== 'daddyparodz/gmail-cleaner' ||
                context.payload.repository.owner.id !== 45983094 || (!isPR && context.ref !== 'refs/heads/main')) {
              throw new Error('Untrusted metadata dispatch');
            }
            const repo = context.payload.repository;
            if (isPR && (!['opened', 'labeled', 'unlabeled'].includes(context.payload.action) ||
                !Number.isSafeInteger(context.payload.number) || context.payload.number <= 0 ||
                eventPR?.number !== context.payload.number || eventPR.state !== 'open' ||
                eventPR.base?.repo?.id !== repo.id || eventPR.head?.repo?.id !== repo.id ||
                eventPR.base.repo.full_name !== repo.full_name || eventPR.head.repo.full_name !== repo.full_name ||
                eventPR.base.ref !== 'main' || !/^[0-9a-f]{40}$/.test(eventPR.base.sha || ''))) {
              throw new Error('Untrusted PR event provenance');
            }
            const inputs = isPR ? {pr_number: String(context.payload.number), head_sha: eventPR.head.sha} : context.payload.inputs || {};
            if (!/^[1-9][0-9]*$/.test(inputs.pr_number || '') ||
                !/^[0-9a-f]{40}$/.test(inputs.head_sha || '')) {
              throw new Error('Explicit PR number and immutable head SHA required');
            }
            const number = Number(inputs.pr_number);
            if (!Number.isSafeInteger(number)) throw new Error('Invalid PR number');
            async function resolve() {
              const {data: candidate} = await github.rest.pulls.get({...context.repo, pull_number: number});
              const repo = context.payload.repository;
              if (candidate.number !== number || candidate.state !== 'open' ||
                  candidate.base?.repo?.id !== repo.id || candidate.head?.repo?.id !== repo.id ||
                  candidate.base.repo.full_name !== repo.full_name || candidate.head.repo.full_name !== repo.full_name ||
                  candidate.base.ref !== 'main' || candidate.base.sha !== (isPR ? eventPR.base.sha : context.sha) ||
                  candidate.head.sha !== inputs.head_sha) {
                throw new Error('PR provenance changed or is not same-repository exact-head');
              }
              return candidate;
            }
            await resolve();
            const pr = await resolve();
            const creator = pr.user.login;

            // Get current assignees from webhook payload
            const currentAssignees = (pr.assignees || []).map(a => a.login);

            // Add creator if not already assigned
            // Add creator if not already assigned
            if (!currentAssignees.includes(creator)) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [creator],
                });
                console.log(`✅ Auto-assigned ${creator} to PR #${pr.number}`);
              } catch (error) {
                console.error(`❌ Failed to auto-assign ${creator}: ${error.message}`);
                core.warning(`Could not auto-assign PR creator: ${error.message}`);
              }
            } else {
              console.log(`ℹ️ ${creator} is already assigned to PR #${pr.number}`);
            }
